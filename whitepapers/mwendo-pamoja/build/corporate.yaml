geometry: "margin=1in"
fontsize: 12pt
linestretch: 1.3
mainfont: "Arial"
classoption: twoside
colorlinks: true
linkcolor: MidnightBlue
urlcolor: MidnightBlue
toccolor: MidnightBlue
header-includes:
  - \usepackage{graphicx}
  - \setkeys{Gin}{width=\linewidth,keepaspectratio}
  - \usepackage{parskip}
  - \usepackage{sectsty}
  - \usepackage[dvipsnames]{xcolor}
  - \sectionfont{\color{MidnightBlue}\Large}
  - \subsectionfont{\color{MidnightBlue}\large}
  - \subsubsectionfont{\color{MidnightBlue}\normalsize}
  - \usepackage{fancyhdr}
  - \pagestyle{fancy}
  - \fancyhf{}
